name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release
        run: npm test
